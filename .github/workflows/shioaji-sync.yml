name: 永豐金證券 (Shioaji) 帳務自動同步

on:
  schedule:
    # 台灣時間週一至週五 14:00 (UTC 06:00)，台股收盤後自動同步持倉與損益
    - cron: "0 6 * * 1-5"
    # 台灣時間週一至週五 08:30 (UTC 00:30)，開盤前確認部位
    - cron: "30 0 * * 1-5"
  workflow_dispatch: # 支援在 GitHub 網頁上隨時手動點擊「Run workflow」立即執行

jobs:
  sync-shioaji:
    name: 同步永豐金持倉與損益
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 簽出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/shioaji-sync/requirements.txt"

      - name: 安裝 Shioaji SDK 與相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/shioaji-sync/requirements.txt

      - name: 執行 Shioaji 抓取並推送至 Taiwan Fin Hub
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          TARGET_WORKER_URL: ${{ secrets.TARGET_WORKER_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python scripts/shioaji-sync/sync.py
